<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Money</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><span class="logo" id="logo"></span>Money<span class="chip" id="version"></span></div>
  <span class="spacer"></span>
  <span class="pill" id="local"></span>
  <button class="icon-btn" id="openFolder"></button>
</header>
<main class="wrap">
  <section class="hero">
    <p class="kicker" id="kicker"></p>
    <h1 id="title"></h1>
    <div class="chips" id="facts"></div>
  </section>
  <section class="sec">
    <div class="drop spot reveal" id="drop">
      <span class="icon-tile big-tile" id="dropIcon"></span>
      <b id="dropTitle"></b>
      <p id="dropText"></p>
      <button class="btn btn-primary" id="pick" type="button"></button>
    </div>
    <div class="results" id="results"></div>
  </section>
  <section class="kpis" id="kpis"></section>
  <section class="sec">
    <div class="sec-head" id="fmtHead"></div>
    <div class="chips" id="formats"></div>
    <p class="note" id="fmtNote"></p>
  </section>
  <footer id="footer"></footer>
</main>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
