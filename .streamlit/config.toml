# Privacy: no telemetry, reachable only from this computer.
[browser]
gatherUsageStats = false

[server]
address = "localhost"
port = 8599
headless = true  # no first-run email prompt; Money.bat opens the browser
enableStaticServing = true  # serves ./static (local font, no Google Fonts)

[client]
toolbarMode = "viewer"  # keeps the menu with Settings -> theme (light / dark / system)

# Shared look; colours per mode below. The app follows the system theme unless chosen in Settings.
[theme]
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [700, 650, 600]
baseFontSize = 14
baseRadius = "12px"
buttonRadius = "10px"
primaryColor = "#2a78d6"
metricValueFontWeight = 650
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/Inter.woff2"
weight = "100 900"

[theme.light]
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#eceef2"
textColor = "#14161a"
borderColor = "#e4e6eb"
dataframeBorderColor = "#eceef2"
dataframeHeaderBackgroundColor = "#f8f9fa"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#1f232a"
textColor = "#e8eaed"
borderColor = "#2a2e36"
dataframeBorderColor = "#2a2e36"
dataframeHeaderBackgroundColor = "#1a1d23"

[theme.dark.sidebar]
backgroundColor = "#14161a"
secondaryBackgroundColor = "#1f232a"
